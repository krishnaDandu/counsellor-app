<div class="container-fluid bg-light min-vh-100">
  <!-- Header -->
  <app-header-panel></app-header-panel>

  <!-- Dashboard -->
  <div class="container py-4">

    <div class="mb-4">

      <h3>
        Dashboard
      </h3>

      <p class="text-muted">
        Welcome to Counsellor Portal
      </p>

    </div>


    <div class="row g-4">

      <!-- Total -->

      <div class="col-md-6 col-xl-3">

        <div class="card dashboard-card shadow-sm border-0">

          <div class="card-body">

            <div class="icon">
              <i class="bi bi-people-fill"></i>
            </div>

            <h6 class="text-muted mt-3">
              Total Enquiries
            </h6>

            <h2>
              {{ dashboard?.totalEnquiries || 0 }}
            </h2>

          </div>

        </div>

      </div>


      <!-- New -->

      <div class="col-md-6 col-xl-3">

        <div class="card dashboard-card shadow-sm border-0">

          <div class="card-body">

            <div class="icon">
              <i class="bi bi-person-plus-fill"></i>
            </div>

            <h6 class="text-muted mt-3">
              New Enquiries
            </h6>

            <h2>
              {{ dashboard?.newEnquiries || 0 }}
            </h2>

          </div>

        </div>

      </div>


      <!-- Enrolled -->

      <div class="col-md-6 col-xl-3">

        <div class="card dashboard-card shadow-sm border-0">

          <div class="card-body">

            <div class="icon">
              <i class="bi bi-check-circle-fill"></i>
            </div>

            <h6 class="text-muted mt-3">
              Enrolled
            </h6>

            <h2>
              {{ dashboard?.enrolledEnquiries || 0 }}
            </h2>

          </div>

        </div>

      </div>


      <!-- Lost -->

      <div class="col-md-6 col-xl-3">

        <div class="card dashboard-card shadow-sm border-0">

          <div class="card-body">

            <div class="icon">
              <i class="bi bi-x-circle-fill"></i>
            </div>

            <h6 class="text-muted mt-3">
              Lost
            </h6>

            <h2>
              {{ dashboard?.lostEnquiries || 0 }}
            </h2>

          </div>

        </div>

      </div>

    </div>

  </div>

  <section class="enquiry-section">
    <app-enquiry-list></app-enquiry-list>
  </section>
</div>
