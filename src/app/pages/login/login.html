<div class="auth-page">

  <div class="container">

    <div class="row justify-content-center align-items-center min-vh-100">

      <div class="col-md-6 col-lg-4">

        <div class="card shadow border-0">

          <div class="card-body p-4 p-md-5">

            <div class="text-center mb-4">

              <div class="logo-circle">
                <i class="bi bi-person-circle"></i>
              </div>

              <h3 class="mt-3">
                Counsellor Login
              </h3>

              <p class="text-muted">
                Login to your account
              </p>

            </div>


            <!-- Error Message -->
            @if (loginError) {
            <div class="alert alert-danger alert-dismissible fade show" role="alert">
              <i class="bi bi-exclamation-triangle-fill me-2"></i>
              {{ loginError }}

              <button type="button" class="btn-close" aria-label="Close" (click)="loginError = ''">
              </button>

            </div>
            }

            <form #loginForm="ngForm" (ngSubmit)="loginForm.valid && login()">

              <div class="mb-3">

                <label class="form-label">
                  Email
                </label>

                <input type="email" class="form-control" name="email" [(ngModel)]="loginData.email" required email
                  placeholder="Enter email">

              </div>

              <div class="mb-4">

                <label class="form-label">
                  Password
                </label>

                <input type="password" class="form-control" name="pwd" [(ngModel)]="loginData.pwd" required
                  placeholder="Enter password">

              </div>

              <button type="submit" class="btn btn-primary w-100" [disabled]="loginForm.invalid || isLoading()">

                @if (isLoading()) {
                <span class="spinner-border spinner-border-sm me-2" role="status" aria-hidden="true">
                </span>
                Please wait...
                } @else {
                <i class="bi bi-box-arrow-in-right me-2"></i>
                Login
                }

              </button>
              <!-- <button type="submit" class="btn btn-primary w-100" [disabled]="loginForm.invalid">

                <i class="bi bi-box-arrow-in-right me-2"></i>

                Login

              </button> -->

            </form>

            <div class="text-center mt-4">

              <span class="text-muted">
                Don't have an account?
              </span>

              <a routerLink="/register" class="ms-1 text-decoration-none">

                Register

              </a>

            </div>

          </div>

        </div>

      </div>

    </div>

  </div>

</div>
